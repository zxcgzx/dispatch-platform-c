services:
  - type: web
    name: dispatch-platform-c
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --host 0.0.0.0 --port $PORT --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RUNS_DIR
        value: /tmp/runs
      - key: LLM_MODE
        value: demo
      - key: SOLVER_MODE
        value: builtin
